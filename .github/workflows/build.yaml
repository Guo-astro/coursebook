name: Coursebook Build

on:
  pull_request:
    branches:
      - master

# A PR build has no side effects, so superseding one is always safe:
# when someone pushes a fixup commit, kill the run for the old commit
# rather than paying for a 9 minute PDF build nobody will look at.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    strategy:
      # The three outputs are independent, and PDF is by far the slowest.
      # With the default fail-fast, a WIKI failure 90 seconds in cancels
      # the 9 minute PDF job, so the run tells you nothing about whether
      # the PDF is healthy and the next push has to rediscover it.
      fail-fast: false
      matrix:
        build_focus: [WIKI, EPUB, PDF]
    env:
      BUILD_FOCUS: ${{ matrix.build_focus }}

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    # Python 3.7 has no build for ubuntu-24.04 or 26.04, so setup-python
    # could not find it. 3.11 has builds for 22.04, 24.04 and 26.04, and
    # works with panflute 1.12.5, which still targets pandoc 2.7's AST.
    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: pip
        cache-dependency-path: requirements.txt

    - name: Install
      run: |
        bash _scripts/install.sh

    - name: Build coursebook
      run: |
        bash _scripts/script.sh

  # Part C of issue #238: a cheap, stdlib-only lint that checks every content
  # figure's \includegraphics carries non-empty alt text. It only reads the
  # .tex sources, so it doesn't need install.sh's TeX/pandoc toolchain and
  # runs in seconds -- keep it in its own job, not the matrix above, so it
  # isn't held hostage by (or holding hostage) the 9 minute PDF build.
  alt-text-lint:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Run alt-text lint unit tests
      run: |
        python3 -m unittest _scripts.test_alt_lint -v

    - name: Run alt-text lint
      run: |
        python3 _scripts/alt_lint.py
