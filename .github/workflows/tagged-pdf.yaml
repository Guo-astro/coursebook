name: Tagged PDF (experimental)

# Issue #238, Part B. Builds the opt-in tagged PDF (make pdf TAGGED=1) on a
# current TeX Live and runs the structure checks B2, B3 and B4a. It only
# reports: both jobs are continue-on-error, it is not a required check, and
# nothing here deploys. See docs/pdf-tagging-spike.md.

on:
  pull_request:
    branches:
      - master
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    continue-on-error: true
    # Pinned TeX Live: TeX Live 2026 (tlmgr r79639; latex-lab 2026-06-08,
    # tagpdf 1.0c 2026-05-17, graphicx 1.2e 2026-05-17, listings 1.11b).
    # TL2026 is the current release, so there is no TL2026-historic tag
    # yet; pin by digest. When moving the pin, re-check the
    # \DocumentMetadata keys in main_tagged.tex against
    # documentmetadata-support.ltx (testphase key names have changed
    # between releases), and switch to TL2026-historic once it exists.
    container:
      image: texlive/texlive:latest@sha256:1a1b8588cd73ac33fe1d7722c4065b3e6eaa3f3a20fb54d2934e42310264d134

    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Install tools
      run: |
        apt-get update -qq
        apt-get install -y --no-install-recommends python3-yaml poppler-utils

    - name: Build tagged PDF
      run: |
        python3 _scripts/gen_order.py order.yaml > order.tex
        start=$(date +%s)
        # Errors are what this job measures, so report them and carry on.
        make TAGGED=1 main.pdf || echo "::warning::tagged build exited non-zero"
        echo "tagged build took $(( $(date +%s) - start ))s"
        # make stops before its mv when latexmk reports an error.
        test -f main.pdf || cp main_tagged.pdf main.pdf
        mv main.pdf main-tagged.pdf
        {
          echo "### Tagged build"
          echo "- tagpdf errors: $(grep -c 'tagpdf Error' main_tagged.log)"
          echo "- TeX errors: $(grep -c '^! ' main_tagged.log)"
          echo "- tagpdf warnings: $(grep -c 'tagpdf Warning' main_tagged.log)"
        } | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Build untagged PDF (same TeX Live, for B4a)
      run: |
        make main.pdf || echo "::warning::untagged build exited non-zero"
        test -f main.pdf || cp main_wrapper.pdf main.pdf
        mv main.pdf main-untagged.pdf

    - name: B4a tagged vs untagged
      run: |
        bash _scripts/compare_pdf_text.sh main-untagged.pdf main-tagged.pdf b4a \
          | tee -a "$GITHUB_STEP_SUMMARY" || true

    - name: Upload PDFs and logs
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tagged-pdf
        path: |
          main-tagged.pdf
          main-untagged.pdf
          main_tagged.log
          main_wrapper.log
          b4a/
        if-no-files-found: warn

  check:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    continue-on-error: true
    steps:
    - name: Checkout repo
      uses: actions/checkout@v4

    - name: Download PDFs
      uses: actions/download-artifact@v4
      with:
        name: tagged-pdf

    # The runner's system Python refuses pip installs (PEP 668).
    - name: Setup python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install tools
      run: |
        # Pinned so the check does not drift.
        pip install 'pikepdf==10.13.0.post1'

    - name: B2 structure check
      run: |
        if [ -f _scripts/alt_lint.py ]; then
          python3 _scripts/alt_lint.py --json > alt-expected.json
          python3 _scripts/check_pdf_tags.py main-tagged.pdf \
            --expected alt-expected.json --json-out b2.json --report-only
        else
          python3 _scripts/check_pdf_tags.py main-tagged.pdf \
            --json-out b2.json --report-only
        fi

    - name: B3 veraPDF PDF/UA-2
      run: |
        # verapdf/cli:v1.30.2, pinned in the script.
        bash _scripts/check_verapdf.sh main-tagged.pdf verapdf-ua2.json \
          | tee -a "$GITHUB_STEP_SUMMARY"

    - name: Upload reports
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: tagged-pdf-reports
        path: |
          b2.json
          verapdf-ua2.json
        if-no-files-found: warn
