# EPUB accessibility metadata (issue #238, Part A step 6).
#
# pandoc >= 3.1.12 writes schema.org accessibility metadata into
# content.opf, and its defaults claim more than this book can back up.
# Every value below is a deliberate claim; epub_check.py fails the build
# if content.opf stops matching this file. Vocabulary:
# https://www.w3.org/2021/a11y-discov-vocab/latest/
#
# If you add a kind of content (audio, video, animation, a figure
# without alt=), revisit this file.

# The book is text plus 48 diagrams (and a cover) that carry information.
# pandoc's default, ["textual"], leaves out the diagrams.
accessModes:
  - textual
  - visual

# Which modes are enough to use the whole book.
#
# We do NOT claim "textual" on its own, although pandoc's default does.
# That claim means a reader who can't see the images loses nothing. Every
# content figure now has alt text (alt_lint.py enforces this). But the
# gates only prove the alt text arrives, not that it is complete. Some of
# the diagrams are dense: heap layouts, page tables, timing and state
# diagrams. Their alt text is a one- or two-sentence summary written to
# go with the surrounding prose, and nobody has audited it against the
# figures as a full equivalent. Until a C2-style review (CONTRIBUTING.md)
# signs off every figure as a full text equivalent, the honest claim is
# textual plus visual together. Adding "textual" is a maintainer
# decision, not a build setting.
accessModeSufficient:
  - textual,visual

# alternativeText: every content image has alt text from its alt= key,
#   and the build fails if one doesn't (the filters and alt_lint.py).
# readingOrder, structuralNavigation, tableOfContents: pandoc writes a
#   linear spine, h1-h6 section headings and a nav document (--toc).
# MathML: pandoc's EPUB3 writer renders the book's LaTeX math as MathML
#   (epub_check.py checks that <math> elements are present).
# We deliberately don't claim displayTransformability, longDescription,
# describedMath or ARIA roles: nothing checks them.
accessibilityFeatures:
  - alternativeText
  - readingOrder
  - structuralNavigation
  - tableOfContents
  - MathML

# Static text and still images only: no flashing, motion simulation or
# sound anywhere in the book.
accessibilityHazards:
  - none

accessibilitySummary: >-
  A text book on C and systems programming. Its diagrams have short text
  alternatives, and the surrounding prose describes each one, but the
  alternatives are summaries, not full equivalents, of the denser
  diagrams. Code examples are text, and mathematics is MathML. The book
  has a table of contents and navigable section headings. There are no
  known hazards.
